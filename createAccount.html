    <header>
      <div class="logo">
        <h1>Shoey</h1>

      <nav>

    <main>
      <section class="create-section">
        <fieldset>
          <legend>Create Account</legend>
          <form
            action="logic/accounts.php"
            name="accountCreateForm"
            method="post"
          >
            <label for="firstname">Firstname:</label>
            <input type="text" name="firstname" class="form-input" /> <br />

            <label for="surname">Surname:</label>
            <input type="text" name="surname" class="form-input" /> <br />

            <label for="email">Email:</label>
            <input type="email" name="email" class="form-input" /> <br />

            <label for="password">Password:</label>
            <input type="password" name="password" class="form-input" /> <br />

            <label for="phoneNo">Phone Number:</label>
            <input type="text" name="phoneNo" class="form-input" /> <br />

            <label for="dOB">Date Of Birth:</label>
            <input type="date" name="dOB" class="form-input" /> <br />

            <label for="address">Address:</label>
            <input type="text" name="address" class="form-input" /> <br /><br />

            <input
              type="submit"
              name="create"
              class="form-submit"
              value="Create Account"
            />
            <br /><br />
          </form>
        </fieldset>
      </section>
