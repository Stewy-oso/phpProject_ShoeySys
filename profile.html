    <header>

      <nav>

    <script>
      function toggleProfileMenu() {
        const menu = document.querySelector(".profileDropdown");

        if (menu.style.display === "block") {
          menu.style.display = "none";
        } else {
          menu.style.display = "block";
        }
      }
    </script>

    <main>
      <section class="update-section">
        <fieldset>
          <legend>Update Details</legend>
          <form action="logic/accounts.php" name="accountUpdate" method="post">
            <label for="firstname">Firstname: </label>
            <input type="text" name="firstname" class="form-input" /> <br />

            <label for="surname">Surname: </label>
            <input type="text" name="surname" class="form-input" /> <br />

            <label for="phoneNo">Phone Number: </label>
            <input type="text" name="phoneNo" class="form-input" /> <br />

            <label for="address">Address: </label>
            <input type="text" name="address" class="form-input" /> <br />
            <br /><br />

            <label for="email">Email: </label>
            <input type="email" name="email" class="form-input" /> <br />
            <label for="password">Current Password: </label>
            <input type="password" name="password" class="form-input" />
            <br /><br />
            <input
              type="submit"
              name="update"
              class="form-submit"
              value="Update Details"
            />
          </form>
        </fieldset>
      </section>

      <section class="delete-section">
        <fieldset>
          <legend>Delete Account</legend>
          <form action="logic/accounts.php" name="accountDelete" method="post">
            <label for="email">Email:</label>
            <input type="email" name="email" class="form-input" /> <br />

            <label for="password">Password:</label>
            <input type="password" name="password" class="form-input" />
            <br /><br />
            <input
              type="submit"
              name="delete"
              class="form-submit"
              value="Delete Account"
            />
          </form>
        </fieldset>
      </section>
    </main>
